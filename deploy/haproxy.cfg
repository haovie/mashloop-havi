# HAProxy in front of the services on this box. TLS ends here; apps listen on
# loopback only. Certificates: /etc/haproxy/certs/<domain>.pem (fullchain +
# key), written by certbot's deploy hook (deploy/certbot-haproxy.sh).
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    # No request log: visitors' addresses are not kept anywhere. HAProxy's own
    # events (start, reload, a backend going down) still reach the global log.
    no log
    option forwardfor
    timeout connect 5s
    timeout client 120s
    timeout server 300s
    timeout http-request 20s
    timeout http-keep-alive 10s

frontend http_in
    bind :80
    # Let's Encrypt checks the domain over plain HTTP; everything else goes to HTTPS.
    acl acme path_beg /.well-known/acme-challenge/
    use_backend acme if acme
    http-request redirect scheme https code 301 unless acme

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000"
    acl host_mashloop req.hdr(host),field(1,:) -i mashloop.truclv.com
    use_backend mashloop if host_mashloop
    default_backend not_found

backend mashloop
    # analysis.json (about 1 MB per song) and the scripts compress well; audio does not.
    compression algo gzip
    compression type application/json text/html text/css application/javascript text/javascript image/svg+xml
    http-request set-header X-Forwarded-Proto https
    server app 127.0.0.1:18765 check inter 5s

backend acme
    server certbot 127.0.0.1:18080

backend not_found
    http-request deny deny_status 404
